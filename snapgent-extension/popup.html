<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #16161a;
      --surface: #1e1e24;
      --surface-2: #26262e;
      --border: rgba(255, 255, 255, 0.08);
      --text: #e8e8ec;
      --muted: rgba(232, 232, 236, 0.6);
      --accent: #3ddc97;
      --ok: #3ddc97;
      --warn: #ffb454;
      --bad: #ff6b6b;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      width: min(350px, 100vw);
      max-width: 100vw;
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    h1 {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .ver {
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
    }
    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      color: var(--accent);
      background: rgba(61, 220, 151, 0.12);
      border: 1px solid rgba(61, 220, 151, 0.3);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 11px 12px;
    }

    .status {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .dot {
      flex: none;
      width: 9px;
      height: 9px;
      margin-top: 4px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.05);
      transition: background 0.2s, box-shadow 0.2s;
    }
    .dot.ok   { background: var(--ok);   box-shadow: 0 0 0 3px rgba(61, 220, 151, 0.18); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(255, 180, 84, 0.18); }
    .dot.bad  { background: var(--bad);  box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.18); }

    .status-text { min-width: 0; flex: 1; }
    #state {
      font-size: 12.5px;
      font-weight: 600;
      line-height: 1.4;
    }
    #tools {
      margin-top: 2px;
      font-size: 11px;
      color: var(--muted);
    }

    .section-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .endpoint-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .endpoint-input {
      flex: 1;
      min-width: 0;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      color: var(--text);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 11px;
    }
    .copy-btn {
      width: auto;
      min-height: 28px;
      padding: 4px 10px;
      font-size: 11px;
    }

    #api-activity {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      white-space: pre-line;
    }

    #servers {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      white-space: pre-line;
    }
    #servers:empty { display: none; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .actions .full { grid-column: 1 / -1; }

    button {
      width: 100%;
      min-height: 34px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      background: var(--surface-2);
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover { background: #30303a; border-color: rgba(255, 255, 255, 0.16); }

    .hint {
      margin: 0;
      font-size: 10.5px;
      line-height: 1.4;
      color: var(--muted);
      text-align: center;
    }
    code {
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 10px;
      background: rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Snapgent Local AI <span class="ver" id="ver"></span></h1>
      <span class="badge">PROXY API</span>
    </header>

    <section class="card">
      <div class="status">
        <span id="dot" class="dot"></span>
        <div class="status-text">
          <div id="state">Bridge: â€¦</div>
          <div id="tools"></div>
        </div>
      </div>
      <div id="servers"></div>
    </section>

    <section class="card">
      <div class="section-title">External Agent Endpoint (OpenAI / Ollama)</div>
      <div class="endpoint-row">
        <input class="endpoint-input" id="api-url" readonly value="http://127.0.0.1:11434/v1" />
        <button class="copy-btn" id="copy-url">Copy</button>
      </div>
      <div id="api-activity">Checking Local API serverâ€¦</div>
    </section>

    <div class="actions">
      <button id="reconnect">â†» Reconnect</button>
      <button id="restart">âŸ³ Restart</button>
      <button class="full" id="settings">âš™ Open AI Worker Tab</button>
    </div>

    <p class="hint">
      Use Base URL <code>http://127.0.0.1:11434/v1</code> in DeepSeek Harness, Hermes, or OpenClaw.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
